name: Set up Echo build
description: Install apt packages, the pinned Rust toolchain with cache, and optionally Node with frontend dependencies.

inputs:
  native:
    description: Install the native audio, D-Bus, and C toolchain packages every Rust build needs.
    default: "true"
  packages:
    description: Extra apt packages for this job, separated by whitespace.
    default: ""
  components:
    description: Extra rustup components, comma-separated.
    default: ""
  node:
    description: Set up Node from .nvmrc and run npm ci for the frontend.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      env:
        NATIVE: ${{ inputs.native }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        packages=()
        if [ "$NATIVE" = true ]; then
          packages+=(
            build-essential
            clang
            libclang-dev
            pkg-config
            libasound2-dev
            libpipewire-0.3-dev
            libpulse-dev
            libdbus-1-dev
          )
        fi
        read -r -a extra <<< "$(printf '%s' "$PACKAGES" | tr '\n' ' ')"
        packages+=("${extra[@]}")
        if [ "${#packages[@]}" -gt 0 ]; then
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
        fi

    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
      with:
        # Keep in step with rust-toolchain.toml.
        toolchain: "1.92.0"
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - if: inputs.node == 'true'
      shell: bash
      run: npm ci --prefix frontend
