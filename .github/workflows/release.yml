name: release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * *"

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate workflow action pins
        run: |
          python3 scripts/verify-workflow-pinning.py --self-test
          python3 scripts/verify-workflow-pinning.py

      - name: Validate release provenance tools
        run: |
          python3 scripts/test_release_provenance.py
          python3 scripts/verify-tag-policy.py --self-test
          python3 scripts/generate-desktop-sbom.py --self-test

      # Required on pull requests (with check / check). Owns packaging-tool
      # tests so check.yml does not run the same Python twice.
      - name: Validate changelog parser
        run: python3 scripts/changelog-notes.py --self-test

      - name: Validate AppStream metainfo
        run: python3 scripts/check_metainfo.py

      - name: Validate Linux package identity rewrite
        run: |
          python3 scripts/rewrite_linux_package_identity.py --self-test
          python3 scripts/test_rewrite_linux_package_identity.py
          python3 scripts/test_linux_package_metadata.py

      - name: Validate APT repository tools
        run: |
          python3 scripts/check_apt_installer.py
          python3 scripts/test_apt_repository.py
          python3 scripts/check_apt_repository.py

      - name: Validate release artefact verifier
        run: scripts/verify-release-artifacts.sh --self-test

      - name: Validate release checksum generator
        run: scripts/generate-release-checksums.sh --self-test

      - name: Validate tagged release
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$RELEASE_TAG" != "v$package_version" ] && [ "$RELEASE_TAG" != "v$package_version-alpha.1" ]; then
            printf 'tag %s does not identify package version %s\n' "$RELEASE_TAG" "$package_version"
            printf 'bump workspace.package.version for each alpha so package managers see an upgrade\n'
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'tag %s points to %s, which is not on origin/main\n' "$RELEASE_TAG" "$GITHUB_SHA"
            exit 1
          fi

          python3 scripts/changelog-notes.py "$RELEASE_TAG" > release-notes.md

      - name: Guard the release tag identity
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$(git cat-file -t "$RELEASE_TAG")" != tag ]; then
            printf 'tag %s is not annotated; create an annotated tag for a new patch version\n' "$RELEASE_TAG"
            exit 1
          fi
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
            -X GET \
            -f branch="$RELEASE_TAG" \
            -f event=push \
            -f per_page=100 \
            --paginate \
            --slurp \
            > tag-runs.json
          python3 scripts/verify-tag-policy.py \
            --runs-json tag-runs.json \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA"

  linux-packages:
    if: github.event_name != 'pull_request'
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT_STEM: ${{ github.ref_type == 'tag' && format('echo-{0}-linux', github.ref_name) || format('echo-nightly-{0}-linux', github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            xdotool \
            desktop-file-utils \
            cpio \
            rpm2cpio \
            rpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          toolchain: "1.89.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: npm ci --prefix frontend

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      - name: Remove stale bundle outputs
        run: rm -rf target/release/bundle

      - name: Bundle deb and rpm
        run: cargo tauri build --ci --bundles deb,rpm

      - name: Rewrite package identity to echo
        run: |
          set -euo pipefail
          shopt -s nullglob
          python3 scripts/rewrite_linux_package_identity.py \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm

      - name: Assert package metadata matches the workspace version
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          shopt -s nullglob
          deb_packages=(target/release/bundle/deb/*.deb)
          rpm_packages=(target/release/bundle/rpm/*.rpm)
          if [ "${#deb_packages[@]}" -ne 1 ] || [ "${#rpm_packages[@]}" -ne 1 ]; then
            printf 'expected exactly one deb and one rpm bundle; found %s deb and %s rpm\n' \
              "${#deb_packages[@]}" "${#rpm_packages[@]}"
            exit 1
          fi
          deb=${deb_packages[0]}
          rpm_pkg=${rpm_packages[0]}
          deb_name=$(dpkg-deb -f "$deb" Package)
          rpm_name=$(rpm -qp --queryformat '%{NAME}' "$rpm_pkg")
          deb_version=$(dpkg-deb -f "$deb" Version)
          rpm_version=$(rpm -qp --queryformat '%{VERSION}' "$rpm_pkg")
          if [ "$deb_name" != echo ]; then
            printf 'deb Package %s is not echo\n' "$deb_name"
            exit 1
          fi
          if [ "$rpm_name" != echo ]; then
            printf 'rpm NAME %s is not echo\n' "$rpm_name"
            exit 1
          fi
          case "$(basename "$deb")" in
            echo_*) ;;
            *)
              printf 'deb filename %s does not start with echo_\n' "$(basename "$deb")"
              exit 1
              ;;
          esac
          if [ "$deb_version" != "$package_version" ]; then
            printf 'deb Version %s does not match workspace version %s\n' "$deb_version" "$package_version"
            exit 1
          fi
          if [ "$rpm_version" != "$package_version" ]; then
            printf 'rpm VERSION %s does not match workspace version %s\n' "$rpm_version" "$package_version"
            exit 1
          fi
          deb_depends=$(dpkg-deb -f "$deb" Depends | tr ',' '\n' | sed -E 's/^ *//; s/ *\(.*\)$//')
          rpm_requires=$(rpm -qp --requires "$rpm_pkg" | awk '{print $1}')
          for dependency in \
            libpipewire-0.3-0 \
            libpulse0 \
            libayatana-appindicator3-1 \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0; do
            if ! grep -Fxq "$dependency" <<< "$deb_depends"; then
              printf 'deb Depends is missing %s: %s\n' "$dependency" "$(dpkg-deb -f "$deb" Depends)"
              exit 1
            fi
          done
          for dependency in \
            pipewire-libs \
            pulseaudio-libs \
            'libayatana-appindicator3.so.1()(64bit)' \
            'libwebkit2gtk-4.1.so.0()(64bit)' \
            'libgtk-3.so.0()(64bit)'; do
            if ! grep -Fxq "$dependency" <<< "$rpm_requires"; then
              printf 'rpm Requires is missing %s\n' "$dependency"
              rpm -qp --requires "$rpm_pkg"
              exit 1
            fi
          done

      - name: Validate AppStream desktop and license files
        run: |
          python3 scripts/validate_linux_package_metadata.py \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm

      - name: Generate desktop SBOM
        run: |
          python3 scripts/generate-desktop-sbom.py \
            --source-revision "$GITHUB_SHA" \
            --source-timestamp "$(git show -s --format=%cI "$GITHUB_SHA")" \
            --output target/release/echo-desktop.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}-bin
          path: |
            target/release/echo-desktop
            target/release/echo-desktop.cdx.json
          if-no-files-found: error

  appimage:
    if: github.event_name != 'pull_request'
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT_STEM: ${{ github.ref_type == 'tag' && format('echo-{0}-linux', github.ref_name) || format('echo-nightly-{0}-linux', github.sha) }}
      # linuxdeploy is an AppImage. GitHub-hosted Ubuntu 24.04 runners
      # block FUSE mounts, so extract instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # linuxdeploy's bundled strip rejects .relr.dyn on current glibc.
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            xdotool \
            desktop-file-utils \
            patchelf \
            librsvg2-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          toolchain: "1.89.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: npm ci --prefix frontend

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      - name: Remove stale bundle outputs
        run: rm -rf target/release/bundle

      - name: Bundle AppImage
        run: cargo tauri build --ci --bundles appimage --verbose --config src-tauri/tauri.appimage.conf.json

      - name: Smoke-test AppImage
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            printf 'expected exactly one AppImage; found %s\n' "${#appimages[@]}"
            exit 1
          fi
          version_output=$(APPIMAGE_EXTRACT_AND_RUN=1 "${appimages[0]}" --version)
          if [ "$version_output" != "echo-desktop $package_version" ]; then
            printf 'AppImage reported %s, expected echo-desktop %s\n' "$version_output" "$package_version"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release-assets:
    if: github.event_name != 'pull_request'
    needs: [linux-packages, appimage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ARTIFACT_STEM: ${{ github.ref_type == 'tag' && format('echo-{0}-linux', github.ref_name) || format('echo-nightly-{0}-linux', github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}
          path: release-assets/packages

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}-bin
          path: release-assets/bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}-appimage
          path: release-assets/appimage

      - name: Stage GitHub Release files
        run: |
          set -euo pipefail
          mkdir -p release-assets/publish
          cp release-assets/packages/deb/*.deb \
            release-assets/packages/rpm/*.rpm \
            release-assets/appimage/*.AppImage \
            release-assets/bin/echo-desktop \
            release-assets/bin/echo-desktop.cdx.json \
            LICENSE-MIT \
            THIRD_PARTY.md \
            release-assets/publish/

      - name: Generate release checksums
        run: scripts/generate-release-checksums.sh release-assets/publish

      - name: Install RPM and AppImage verification dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cpio \
            libegl1 \
            p7zip-full \
            rpm

      - name: Smoke-test RPM fallback extraction
        run: |
          shopt -s nullglob
          rpm_packages=(release-assets/packages/rpm/*.rpm)
          scripts/verify-release-artifacts.sh --rpm-fallback "${rpm_packages[0]}"

      - name: Inspect the complete staged release
        run: scripts/verify-release-artifacts.sh release-assets/publish

      - name: Verify staged release checksums
        run: scripts/generate-release-checksums.sh --verify release-assets/publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}-publish
          path: release-assets/publish/*
          if-no-files-found: error

  attest-assets:
    if: github.event_name != 'pull_request'
    needs: release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      ARTIFACT_STEM: ${{ github.ref_type == 'tag' && format('echo-{0}-linux', github.ref_name) || format('echo-nightly-{0}-linux', github.sha) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}-publish
          path: release-assets/publish

      - name: Attest GitHub-built release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/publish/*

  github-release:
    if: >-
      github.ref_type == 'tag' &&
      needs.release-assets.result == 'success' &&
      needs.attest-assets.result == 'success'
    needs: [release-assets, attest-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ARTIFACT_STEM: echo-${{ github.ref_name }}-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}-publish
          path: release-assets/publish

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog-notes.py "$RELEASE_TAG" > release-notes.md

      - name: Verify the downloaded release checksums
        run: scripts/generate-release-checksums.sh --verify release-assets/publish

      - name: Attach GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: release-assets/publish/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false

  apt-repository:
    if: github.ref_type == 'tag'
    needs: [linux-packages, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ARTIFACT_STEM: echo-${{ github.ref_name }}-linux
      RELEASE_TAG: ${{ github.ref_name }}
      APT_REPOSITORY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apt/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_STEM }}
          path: packages

      - name: Build signed APT repository
        env:
          DEB_SIGNING_PRIVATE_KEY: ${{ secrets.DEB_SIGNING_PRIVATE_KEY }}
          DEB_SIGNING_KEY_FINGERPRINT: ${{ secrets.DEB_SIGNING_KEY_FINGERPRINT }}
          DEB_SIGNING_KEY_PASSPHRASE: ${{ secrets.DEB_SIGNING_KEY_PASSPHRASE }}
          DEB_SIGNING_PUBLIC_KEY: ${{ vars.DEB_SIGNING_PUBLIC_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          missing=()
          [ -n "${DEB_SIGNING_PRIVATE_KEY}" ] || missing+=("DEB_SIGNING_PRIVATE_KEY")
          [ -n "${DEB_SIGNING_KEY_FINGERPRINT}" ] || missing+=("DEB_SIGNING_KEY_FINGERPRINT")
          [ -n "${DEB_SIGNING_KEY_PASSPHRASE}" ] || missing+=("DEB_SIGNING_KEY_PASSPHRASE")
          [ -n "${DEB_SIGNING_PUBLIC_KEY}" ] || missing+=("DEB_SIGNING_PUBLIC_KEY repository variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Required Linux signing inputs are missing: ${missing[*]}" >&2
            exit 1
          fi

          debs=(packages/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            printf 'expected exactly one application deb; found %s\n' "${#debs[@]}"
            exit 1
          fi

          gnupg_home="${RUNNER_TEMP}/linux-signing-gnupg"
          verification_home="${RUNNER_TEMP}/linux-signing-verify-gnupg"
          private_key_file="${RUNNER_TEMP}/linux-signing-private-key.asc"
          public_key_file="${RUNNER_TEMP}/linux-signing-public-key.asc"
          passphrase_file="${RUNNER_TEMP}/linux-signing-passphrase"

          rm -rf "${gnupg_home}" "${verification_home}"
          mkdir -p "${gnupg_home}" "${verification_home}"
          chmod 700 "${gnupg_home}" "${verification_home}"

          printf '%s' "${DEB_SIGNING_PRIVATE_KEY}" | base64 --decode > "${private_key_file}"
          printf '%s' "${DEB_SIGNING_PUBLIC_KEY}" | base64 --decode > "${public_key_file}"
          printf '%s' "${DEB_SIGNING_KEY_PASSPHRASE}" > "${passphrase_file}"
          chmod 600 "${passphrase_file}"

          export GNUPGHOME="${gnupg_home}"
          echo allow-loopback-pinentry > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          gpg --batch --import "${private_key_file}"

          expected_fingerprint="$(printf '%s' "${DEB_SIGNING_KEY_FINGERPRINT}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          imported_fingerprint="$(gpg --batch --with-colons --fingerprint "${expected_fingerprint}" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [ "${imported_fingerprint}" != "${expected_fingerprint}" ]; then
            echo "Imported Linux signing key fingerprint did not match DEB_SIGNING_KEY_FINGERPRINT." >&2
            exit 1
          fi

          GNUPGHOME="${verification_home}" gpg --batch --import "${public_key_file}"

          mkdir -p dist/rust/artifacts
          python3 scripts/build_apt_repository.py "${debs[0]}" \
            --output dist/rust/apt-pages/apt \
            --repository-url "${APT_REPOSITORY_URL}" \
            --gpg-key "${expected_fingerprint}" \
            --gpg-homedir "${gnupg_home}" \
            --gpg-passphrase-file "${passphrase_file}" \
            --public-key-out dist/rust/artifacts/echo-archive-keyring.pgp \
            --setup-package-out dist/rust/artifacts/echo-repository-setup_1.0_all.deb \
            --clean
          cp dist/rust/artifacts/echo-archive-keyring.pgp \
            dist/rust/apt-pages/apt/echo-archive-keyring.pgp

          (
            cd dist/rust/artifacts
            sha256sum echo-repository-setup_1.0_all.deb > echo-repository-setup_1.0_all.deb.sha256
          )
          GNUPGHOME="${gnupg_home}" gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "${passphrase_file}" \
            --local-user "${expected_fingerprint}" \
            --detach-sign --armor \
            --output dist/rust/artifacts/echo-repository-setup_1.0_all.deb.sha256.asc \
            dist/rust/artifacts/echo-repository-setup_1.0_all.deb.sha256
          GNUPGHOME="${verification_home}" gpg --batch --verify \
            dist/rust/artifacts/echo-repository-setup_1.0_all.deb.sha256.asc \
            dist/rust/artifacts/echo-repository-setup_1.0_all.deb.sha256

          LINUX_GPG_FINGERPRINT="${expected_fingerprint}" \
            bash scripts/stage-apt-installer-assets.sh --stage-public

          extras=(
            dist/rust/artifacts/echo-repository-setup_1.0_all.deb
            dist/rust/artifacts/echo-repository-setup_1.0_all.deb.sha256
            dist/rust/artifacts/echo-repository-setup_1.0_all.deb.sha256.asc
            dist/rust/artifacts/echo-archive-keyring.pgp
            dist/rust/artifacts/install-apt-repo.sh
          )
          gh release upload "${RELEASE_TAG}" "${extras[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Clean up Linux signing environment
        if: always()
        run: |
          set -euo pipefail
          GNUPGHOME="${RUNNER_TEMP}/linux-signing-gnupg" gpgconf --kill gpg-agent || true
          rm -rf \
            "${RUNNER_TEMP}/linux-signing-gnupg" \
            "${RUNNER_TEMP}/linux-signing-verify-gnupg" \
            "${RUNNER_TEMP}/linux-signing-private-key.asc" \
            "${RUNNER_TEMP}/linux-signing-public-key.asc" \
            "${RUNNER_TEMP}/linux-signing-passphrase"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload APT repository pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/rust/apt-pages

  publish-apt:
    if: github.ref_type == 'tag'
    needs: apt-repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy APT repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
