name: release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate changelog parser
        run: python3 scripts/changelog-notes.py --self-test

      - name: Validate tagged release
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$RELEASE_TAG" != "v$package_version" ] && [ "$RELEASE_TAG" != "v$package_version-alpha.1" ]; then
            printf 'tag %s does not identify package version %s\n' "$RELEASE_TAG" "$package_version"
            printf 'bump workspace.package.version for each alpha so package managers see an upgrade\n'
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'tag %s points to %s, which is not on origin/main\n' "$RELEASE_TAG" "$GITHUB_SHA"
            exit 1
          fi

          python3 scripts/changelog-notes.py "$RELEASE_TAG" > release-notes.md

  linux-packages:
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARTIFACT_STEM: ${{ github.ref_type == 'tag' && format('echo-{0}-linux', github.ref_name) || format('echo-nightly-{0}-linux', github.sha) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            xdotool \
            desktop-file-utils \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --prefix frontend

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      - name: Remove stale bundle outputs
        run: rm -rf target/release/bundle

      - name: Bundle deb and rpm
        run: cargo tauri build --ci --bundles deb,rpm

      - name: Assert package metadata matches the workspace version
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          shopt -s nullglob
          deb_packages=(target/release/bundle/deb/*.deb)
          rpm_packages=(target/release/bundle/rpm/*.rpm)
          if [ "${#deb_packages[@]}" -ne 1 ] || [ "${#rpm_packages[@]}" -ne 1 ]; then
            printf 'expected exactly one deb and one rpm bundle; found %s deb and %s rpm\n' \
              "${#deb_packages[@]}" "${#rpm_packages[@]}"
            exit 1
          fi
          deb=${deb_packages[0]}
          rpm_pkg=${rpm_packages[0]}
          deb_version=$(dpkg-deb -f "$deb" Version)
          rpm_version=$(rpm -qp --queryformat '%{VERSION}' "$rpm_pkg")
          if [ "$deb_version" != "$package_version" ]; then
            printf 'deb Version %s does not match workspace version %s\n' "$deb_version" "$package_version"
            exit 1
          fi
          if [ "$rpm_version" != "$package_version" ]; then
            printf 'rpm VERSION %s does not match workspace version %s\n' "$rpm_version" "$package_version"
            exit 1
          fi
          deb_depends=$(dpkg-deb -f "$deb" Depends | tr ',' '\n' | sed -E 's/^ *//; s/ *\(.*\)$//')
          rpm_requires=$(rpm -qp --requires "$rpm_pkg" | awk '{print $1}')
          for dependency in \
            libpipewire-0.3-0 \
            libpulse0 \
            libayatana-appindicator3-1 \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0; do
            if ! grep -Fxq "$dependency" <<< "$deb_depends"; then
              printf 'deb Depends is missing %s: %s\n' "$dependency" "$(dpkg-deb -f "$deb" Depends)"
              exit 1
            fi
          done
          for dependency in \
            pipewire-libs \
            pulseaudio-libs \
            'libayatana-appindicator3.so.1()(64bit)' \
            'libwebkit2gtk-4.1.so.0()(64bit)' \
            'libgtk-3.so.0()(64bit)'; do
            if ! grep -Fxq "$dependency" <<< "$rpm_requires"; then
              printf 'rpm Requires is missing %s\n' "$dependency"
              rpm -qp --requires "$rpm_pkg"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_STEM }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_STEM }}-bin
          path: target/release/echo-desktop
          if-no-files-found: error

  appimage:
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      ARTIFACT_STEM: ${{ github.ref_type == 'tag' && format('echo-{0}-linux', github.ref_name) || format('echo-nightly-{0}-linux', github.sha) }}
      # linuxdeploy is an AppImage. GitHub-hosted Ubuntu 24.04 runners
      # block FUSE mounts, so extract instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # linuxdeploy's bundled strip rejects .relr.dyn on current glibc.
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            xdotool \
            desktop-file-utils \
            patchelf \
            librsvg2-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --prefix frontend

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      - name: Remove stale bundle outputs
        run: rm -rf target/release/bundle

      - name: Bundle AppImage
        run: cargo tauri build --ci --bundles appimage --verbose --config src-tauri/tauri.appimage.conf.json

      - name: Smoke-test AppImage
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            printf 'expected exactly one AppImage; found %s\n' "${#appimages[@]}"
            exit 1
          fi
          version_output=$(APPIMAGE_EXTRACT_AND_RUN=1 "${appimages[0]}" --version)
          if [ "$version_output" != "echo-desktop $package_version" ]; then
            printf 'AppImage reported %s, expected echo-desktop %s\n' "$version_output" "$package_version"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_STEM }}-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release-assets:
    if: github.ref_type != 'tag'
    needs: linux-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_STEM: ${{ github.ref_type == 'tag' && format('echo-{0}-linux', github.ref_name) || format('echo-nightly-{0}-linux', github.sha) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_STEM }}
          path: release-assets/packages

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_STEM }}-bin
          path: release-assets/bin

      - name: Validate staged release asset layout
        run: |
          shopt -s nullglob
          deb_packages=(release-assets/packages/deb/*.deb)
          rpm_packages=(release-assets/packages/rpm/*.rpm)
          binary_count=0
          if [ -f release-assets/bin/echo-desktop ]; then
            binary_count=1
          fi
          if [ "${#deb_packages[@]}" -ne 1 ] || [ "${#rpm_packages[@]}" -ne 1 ] || [ "$binary_count" -ne 1 ]; then
            printf 'expected one staged deb, rpm, and binary; found %s, %s, and %s\n' \
              "${#deb_packages[@]}" "${#rpm_packages[@]}" "$binary_count"
            exit 1
          fi

  qualified-release-assets:
    if: github.ref_type == 'tag'
    needs: linux-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download qualified tagged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/qualified
          gh release download "qualification-${GITHUB_SHA}" --dir release-assets/qualified

      - name: Install qualified asset verification dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cpio rpm

      - name: Verify qualified tagged assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=${RELEASE_TAG#v}
          python3 scripts/stage-qualified-whisper-release.py \
            --verify release-assets/qualified \
            --expected-version "$package_version" \
            --expected-commit "$GITHUB_SHA"

      - uses: actions/upload-artifact@v7
        with:
          name: echo-${{ github.ref_name }}-qualified-release
          path: release-assets/qualified
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: qualified-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: echo-${{ github.ref_name }}-qualified-release
          path: release-assets/qualified

      - name: Extract release notes
        run: python3 scripts/changelog-notes.py "${{ github.ref_name }}" > release-notes.md

      - name: Attach GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          files: |
            release-assets/qualified/*.deb
            release-assets/qualified/*.rpm
            release-assets/qualified/echo-desktop
            release-assets/qualified/qualified-release.json
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
