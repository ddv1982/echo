name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check workflow action pins
        run: |
          python3 scripts/verify-workflow-pinning.py --self-test
          python3 scripts/verify-workflow-pinning.py

      - name: Check release cleanup policy
        run: python3 scripts/test_release_history.py

      - name: Check public documentation links
        run: python3 scripts/check-doc-links.py

      - name: Lint Python scripts with Ruff
        run: pipx run --spec ruff==0.14.11 ruff check scripts

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            ripgrep \
            xdotool \
            desktop-file-utils \
            xvfb

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: npm ci --prefix frontend

      - run: npm run ipc:check --prefix frontend

      - run: npx --prefix frontend playwright install --with-deps chromium

      - run: ./scripts/verify-settings-ux.sh

      - name: Reclaim browser test space
        run: |
          rm -rf "$HOME/.cache/ms-playwright"
          sudo apt-get clean

      - run: npm run build --prefix frontend

      - run: npm run lint --prefix frontend

      - run: npm run test --prefix frontend

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Reclaim clippy artifacts
        run: cargo clean

      - run: xvfb-run -a cargo test --workspace

      - run: ./scripts/verify-stt-benchmark.sh

      - run: ./scripts/verify-stt-corpus.sh

      - run: ./scripts/verify-whisper-runtime-archive.sh

      - name: Reclaim test artifacts
        run: cargo clean

      - run: cargo build --release

      - name: Check icon raster drift
        run: |
          ./target/release/xtask
          git diff --exit-code -- src-tauri/icons frontend/public assets/icons

      - name: Validate desktop entry
        run: |
          out=$(desktop-file-validate packaging/Echo.desktop 2>&1) || true
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Check changelog notes
        run: |
          python3 scripts/changelog-notes.py --self-test
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 scripts/changelog-notes.py "v$package_version-alpha.1" > /dev/null \
            || python3 scripts/changelog-notes.py "v$package_version" > /dev/null
