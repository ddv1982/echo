[package]
name = "echo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tauri desktop shell for Echo dictation"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ashpd = { version = "=0.13.11", default-features = false, features = ["global_shortcuts", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
echo = { path = "../crates/echo" }
echo-core = { path = "../crates/echo-core" }
futures-util = { version = "0.3", default-features = false }
global-hotkey = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.43", default-features = false, features = ["macros", "rt", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }

[lints]
workspace = true
