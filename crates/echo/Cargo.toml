[package]
name = "echo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Linux hold-to-talk dictation"
default-run = "echo-app"
autobins = false

[lints]
workspace = true

[[bin]]
name = "echo-app"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
echo-core = { path = "../echo-core" }
hound = "3.5"
x11rb = { version = "0.13", features = ["shape"] }
