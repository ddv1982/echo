[package]
name = "echo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Private local dictation for Linux"

[lints]
workspace = true

[dependencies]
cpal = { version = "=0.18.2", features = ["pipewire", "pulseaudio"] }
bzip2 = "0.6"
echo-core = { path = "../echo-core" }
flate2 = "1"
fs2 = "0.4"
hound = "3.5"
notify-rust = "4.18.0"
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
tar = "0.4"
tempfile = "3.27"
tiny-skia = "0.12"
ureq = "3.4.0"
x11rb = { version = "0.14", features = ["shape"] }

[dev-dependencies]
filetime = "0.2"
