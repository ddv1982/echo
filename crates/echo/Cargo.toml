[package]
name = "echo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Private local dictation for Linux"

[lints]
workspace = true

[dependencies]
cpal = "=0.18.2"
bzip2 = "0.6"
echo-core = { path = "../echo-core" }
flate2 = "1"
fs2 = "0.4"
hound = "3.5"
notify-rust = "4.17.0"
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tiny-skia = "0.12"
ureq = "3.4.0"
x11rb = { version = "0.13", features = ["shape"] }
