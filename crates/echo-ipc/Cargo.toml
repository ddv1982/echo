[package]
name = "echo-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Echo desktop IPC schema"
publish = false

[features]
default = []
desktop = ["dep:echo", "dep:echo-core"]

[dependencies]
echo = { path = "../echo", optional = true }
echo-core = { path = "../echo-core", optional = true }
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
